[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-cli"
version = "1.0.0"
description = "CLI profissional para inspecao de arquivos, hashes e HTTP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
pulse-cli = "pulse_cli.cli:main"

[tool.setuptools.packages.find]
include = ["pulse_cli*"]
